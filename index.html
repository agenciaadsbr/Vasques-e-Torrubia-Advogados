<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vasques e Torrubia Advogados | Rio de Janeiro</title>
<meta name="description" content="Vasques e Torrubia Advogados: orientação jurídica em Direito à Saúde e em Direitos da Pessoa com Deficiência no Rio de Janeiro.">
<meta name="theme-color" content="#2F5240">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/base.css">
<style>
.home{min-height:100vh;display:flex;flex-direction:column;background:var(--vt-salvia)}
.home__in{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:64px 20px;text-align:center}
.home__in img{height:120px;width:auto}
.home__in h1{font-family:var(--vt-serif);font-weight:600;font-size:40px;color:var(--vt-tinta);max-width:640px}
.home__opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;width:100%;max-width:760px}
.home__opts a{display:flex;flex-direction:column;gap:8px;padding:32px;background:var(--vt-creme);color:var(--vt-tinta);text-decoration:none;border-radius:20px;transition:transform .25s ease,box-shadow .25s ease}
.home__opts a:hover{transform:translateY(-3px);box-shadow:0 16px 32px rgba(26,23,24,.15)}
.home__opts strong{font-family:var(--vt-serif);font-size:28px;font-weight:600}
.home__opts span{color:var(--vt-texto-suave)}
@media (max-width:700px){.home__opts{grid-template-columns:minmax(0,1fr)}.home__in h1{font-size:30px}.home__in img{height:90px}}
</style>
</head>
<body>
<main class="home">
  <div class="home__in">
    <img src="/assets/img/logo-ink.svg" alt="Vasques &amp; Torrubia Advogados" width="213" height="120">
    <h1>Orientação jurídica com clareza, no Rio de Janeiro</h1>
    <nav class="home__opts" aria-label="Áreas de atuação">
      <a href="/direito-a-saude"><strong>Direito à Saúde</strong><span>Planos de saúde: negativas, terapias, reajustes e descredenciamentos</span></a>
      <a href="/direitos-da-pessoa-com-deficiencia"><strong>Direitos da Pessoa com Deficiência</strong><span>Aposentadoria da PcD, BPC/LOAS, trabalho e curatela</span></a>
    </nav>
  </div>
</main>
</body>
</html>
