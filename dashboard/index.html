<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leads — Vasques e Torrubia Advogados</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#0A0A0A;--card:#171717;--card2:#1F1F1F;--line:#262626;--txt:#EDEDED;--mut:#A1A1A1;--dim:#737373;--ok:#4ADE80;--a1:#E5E5E5;--a2:#85B296;--a3:#B8702F;--err:#F87171}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.hide{display:none !important}
/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:14px}
.login h1{margin:0 0 4px;font-size:15px;letter-spacing:.12em;font-weight:600}
.login p{margin:0 0 8px;color:var(--mut);font-size:13px}
label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mut);letter-spacing:.04em}
input[type=text],input[type=password],input[type=date]{height:40px;padding:0 12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;outline:none}
input:focus{border-color:#525252}
input[type=date]{height:32px;padding:0 8px;color-scheme:dark;font-size:13px}
.btn{height:40px;border:0;border-radius:8px;background:var(--txt);color:#0A0A0A;font-weight:600;cursor:pointer}
.btn[disabled]{opacity:.6;cursor:wait}
.ghost{height:32px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--mut);font-size:12px;letter-spacing:.08em;cursor:pointer}
.ghost:hover{color:var(--txt);border-color:#404040}
.erro{min-height:18px;color:var(--err);font-size:13px;margin:0}
/* App */
.app{max-width:1180px;margin:0 auto;padding:28px 20px 60px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.top h1{margin:0;font-size:16px;letter-spacing:.14em;font-weight:600}
.top p{margin:4px 0 0;color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.card__head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card__head h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--txt)}
.range{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.range label{flex-direction:row;align-items:center;gap:6px;font-size:11px}
.chart{position:relative;height:300px}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;color:var(--mut);font-size:12px}
.legend i{display:inline-block;width:10px;height:2px;margin-right:6px;vertical-align:middle}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi span{display:block;color:var(--dim);font-size:11px;letter-spacing:.08em}
.kpi b{font-size:20px;font-weight:600}
.tbl{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--dim);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
td{color:var(--txt)}
td.m{color:var(--mut)}
tr:last-child td{border-bottom:0}
.empty{padding:28px 12px;text-align:center;color:var(--dim)}
.wa{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:6px;color:var(--mut);text-decoration:none;font-size:12px}
.wa:hover{color:var(--ok);border-color:#14532d}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--mut);font-size:12px}
@media (max-width:640px){.top{flex-direction:column}.kpis{grid-template-columns:minmax(0,1fr)}.chart{height:240px}.card{padding:16px}}
</style>
</head>
<body>

<main class="login" id="tela-login">
  <form id="form-login" autocomplete="on">
    <h1>LEADS — VASQUES E TORRUBIA</h1>
    <p>Acesso restrito à equipe do escritório.</p>
    <label for="usuario">USUÁRIO<input id="usuario" name="username" type="text" autocomplete="username" required></label>
    <label for="senha">SENHA<input id="senha" name="password" type="password" autocomplete="current-password" required></label>
    <p class="erro" id="erro-login" role="alert"></p>
    <button class="btn" type="submit" id="btn-login">Entrar</button>
  </form>
</main>

<div class="app hide" id="tela-app">
  <header class="top">
    <div>
      <h1>LEADS — VASQUES E TORRUBIA ADVOGADOS</h1>
      <p id="subtitulo">Carregando...</p>
    </div>
    <button class="ghost" type="button" id="btn-sair">SAIR</button>
  </header>

  <section class="card" aria-labelledby="t-evol">
    <div class="card__head">
      <h2 id="t-evol">Evolução diária</h2>
      <div class="range">
        <label for="de">DE <input type="date" id="de"></label>
        <label for="ate">ATÉ <input type="date" id="ate"></label>
      </div>
    </div>
    <div class="kpis">
      <div class="kpi"><span>VISITAS</span><b id="k-vis">—</b></div>
      <div class="kpi"><span>CADASTROS</span><b id="k-lead">—</b></div>
      <div class="kpi"><span>CONVERSÃO</span><b id="k-conv">—</b></div>
    </div>
    <div class="chart"><canvas id="grafico" aria-label="Gráfico de visitas, cadastros e conversão por dia"></canvas></div>
    <div class="legend"><span><i style="background:var(--a1)"></i>Visitas</span><span><i style="background:var(--a2)"></i>Cadastros</span><span><i style="background:var(--a3)"></i>Taxa de conversão (%)</span></div>
  </section>

  <section class="card" aria-labelledby="t-lp">
    <div class="card__head"><h2 id="t-lp">Conversão por LP</h2></div>
    <div class="tbl"><table><thead><tr><th>LP</th><th>Visitas</th><th>Leads</th><th>Conv.</th></tr></thead><tbody id="tb-lp"></tbody></table></div>
  </section>

  <section class="card" aria-labelledby="t-leads">
    <div class="card__head"><h2 id="t-leads">Leads</h2></div>
    <div class="tbl"><table><thead><tr><th>Nome</th><th>WhatsApp</th><th>LP</th><th>Origem</th><th>Data</th><th>Ação</th></tr></thead><tbody id="tb-leads"></tbody></table></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
(function () {
  var URL_SB = 'https://qxhnjzyhtllmtdrcyygi.supabase.co';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4aG5qenlodGxsbXRkcmN5eWdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyMzczNjgsImV4cCI6MjA5NzgxMzM2OH0.DWf4I_x9F--H7ZZHUt_n4V3B__Nlsf1jNZdUV0vNBLU';
  var USUARIOS = { admin: 'admin@vasques-torrubia.adsbr.internal' }; // usuário exibido → e-mail interno do Supabase Auth
  var SITES = { 'vasques-torrubia-saude': 'Direito à Saúde', 'vasques-torrubia-pcd': 'Direitos da PcD' };
  var NOME_CLIENTE = 'Vasques e Torrubia Advogados';

  var sb = window.supabase.createClient(URL_SB, ANON, { auth: { persistSession: true, autoRefreshToken: true } });
  var $ = function (id) { return document.getElementById(id); };
  var grafico = null;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function isoLocal(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function fmtTel(d) { d = String(d || '').replace(/\D/g, ''); if (d.length === 13 && d.indexOf('55') === 0) d = d.slice(2); return d.length === 11 ? '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7) : d.length === 10 ? '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6) : d; }
  function waNum(d) { d = String(d || '').replace(/\D/g, ''); return d.length <= 11 ? '55' + d : d; }
  function fmtData(t) { var d = new Date(t); return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }

  /* período padrão: últimos 30 dias */
  var hoje = new Date();
  $('ate').value = isoLocal(hoje);
  $('de').value = isoLocal(new Date(hoje.getTime() - 29 * 864e5));

  async function todos(tabela, colunas, ini, fim) {
    var out = [], pag = 1000, de = 0;
    while (true) {
      var r = await sb.from(tabela).select(colunas).in('site', Object.keys(SITES)).gte('created_at', ini).lt('created_at', fim).order('created_at', { ascending: false }).range(de, de + pag - 1);
      if (r.error) throw r.error;
      out = out.concat(r.data);
      if (r.data.length < pag || out.length >= 20000) break;
      de += pag;
    }
    return out;
  }

  async function carregar() {
    $('subtitulo').textContent = 'Carregando...';
    var ini = new Date($('de').value + 'T00:00:00');
    var fim = new Date($('ate').value + 'T00:00:00'); fim = new Date(fim.getTime() + 864e5);
    if (isNaN(ini) || isNaN(fim) || ini >= fim) { $('subtitulo').textContent = 'Período inválido.'; return; }
    try {
      var res = await Promise.all([
        todos('lp_leads', 'id,site,nome,whatsapp,origem,created_at', ini.toISOString(), fim.toISOString()),
        todos('lp_visits', 'site,created_at', ini.toISOString(), fim.toISOString())
      ]);
      render(res[0], res[1], ini, fim);
    } catch (e) {
      $('subtitulo').textContent = 'Não foi possível carregar os dados. Tente entrar novamente.';
      console.error(e);
    }
  }

  function render(leads, visitas, ini, fim) {
    var nL = leads.length, nV = visitas.length;
    $('subtitulo').textContent = nL + (nL === 1 ? ' lead' : ' leads') + ' no período';
    $('k-vis').textContent = nV.toLocaleString('pt-BR');
    $('k-lead').textContent = nL.toLocaleString('pt-BR');
    $('k-conv').textContent = nV ? (nL / nV * 100).toFixed(1).replace('.', ',') + '%' : '—';

    /* série diária */
    var dias = [], idx = {};
    for (var t = ini.getTime(); t < fim.getTime(); t += 864e5) { var k = isoLocal(new Date(t)); idx[k] = dias.length; dias.push({ k: k, v: 0, l: 0 }); }
    visitas.forEach(function (v) { var k = isoLocal(new Date(v.created_at)); if (k in idx) dias[idx[k]].v++; });
    leads.forEach(function (l) { var k = isoLocal(new Date(l.created_at)); if (k in idx) dias[idx[k]].l++; });
    var labels = dias.map(function (d) { var p = d.k.split('-'); return p[2] + '/' + p[1]; });
    var conv = dias.map(function (d) { return d.v ? +(d.l / d.v * 100).toFixed(1) : 0; });
    if (grafico) grafico.destroy();
    grafico = new Chart($('grafico'), {
      type: 'line',
      data: { labels: labels, datasets: [
        { label: 'Visitas', data: dias.map(function (d) { return d.v; }), borderColor: '#E5E5E5', backgroundColor: '#E5E5E5', tension: .3, pointRadius: 0, borderWidth: 1.6, yAxisID: 'y' },
        { label: 'Cadastros', data: dias.map(function (d) { return d.l; }), borderColor: '#85B296', backgroundColor: '#85B296', tension: .3, pointRadius: 2, borderWidth: 1.8, yAxisID: 'y' },
        { label: 'Conversão (%)', data: conv, borderColor: '#B8702F', backgroundColor: '#B8702F', borderDash: [4, 4], tension: .3, pointRadius: 0, borderWidth: 1.4, yAxisID: 'y1' }
      ] },
      options: {
        responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
        plugins: { legend: { display: false }, tooltip: { backgroundColor: '#262626', borderColor: '#404040', borderWidth: 1, callbacks: { label: function (c) { return ' ' + c.dataset.label + ': ' + c.formattedValue + (c.datasetIndex === 2 ? '%' : ''); } } } },
        scales: {
          x: { grid: { color: '#1f1f1f' }, ticks: { color: '#737373', maxTicksLimit: 10 } },
          y: { beginAtZero: true, grid: { color: '#1f1f1f' }, ticks: { color: '#737373', precision: 0 } },
          y1: { beginAtZero: true, position: 'right', grid: { display: false }, ticks: { color: '#737373', callback: function (v) { return v + '%'; } } }
        }
      }
    });

    /* conversão por LP */
    var lp = Object.keys(SITES).map(function (s) {
      var v = visitas.filter(function (x) { return x.site === s; }).length, l = leads.filter(function (x) { return x.site === s; }).length;
      return '<tr><td>' + esc(SITES[s]) + '</td><td>' + v.toLocaleString('pt-BR') + '</td><td>' + l.toLocaleString('pt-BR') + '</td><td>' + (v ? (l / v * 100).toFixed(1).replace('.', ',') + '%' : '—') + '</td></tr>';
    });
    $('tb-lp').innerHTML = (nV || nL) ? lp.join('') : '<tr><td colspan="4" class="empty">Nenhum dado encontrado</td></tr>';

    /* leads */
    if (!nL) { $('tb-leads').innerHTML = '<tr><td colspan="6" class="empty">Nenhum lead encontrado</td></tr>'; return; }
    $('tb-leads').innerHTML = leads.map(function (l) {
      var msg = 'Olá, ' + (l.nome || '').trim().split(' ')[0] + '. Recebemos seu contato através da ' + NOME_CLIENTE + ' e gostaria de dar continuidade ao seu atendimento.';
      var href = 'https://wa.me/' + waNum(l.whatsapp) + '?text=' + encodeURIComponent(msg);
      return '<tr><td>' + esc(l.nome) + '</td><td class="m">' + esc(fmtTel(l.whatsapp)) + '</td><td><span class="pill">' + esc(SITES[l.site] || l.site) + '</span></td><td class="m">' + esc(l.origem || '—') + '</td><td class="m">' + esc(fmtData(l.created_at)) + '</td>' +
        '<td><a class="wa" href="' + esc(href) + '" target="_blank" rel="noopener">WhatsApp</a></td></tr>';
    }).join('');
  }

  function mostrarApp(on) { $('tela-login').classList.toggle('hide', on); $('tela-app').classList.toggle('hide', !on); if (on) carregar(); }

  $('form-login').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var u = $('usuario').value.trim().toLowerCase();
    var email = USUARIOS[u] || (u.indexOf('@') > 0 ? u : null);
    if (!email) { $('erro-login').textContent = 'Usuário ou senha inválidos.'; return; }
    $('btn-login').disabled = true; $('erro-login').textContent = '';
    var r = await sb.auth.signInWithPassword({ email: email, password: $('senha').value });
    $('btn-login').disabled = false;
    if (r.error) { $('erro-login').textContent = 'Usuário ou senha inválidos.'; return; }
    $('senha').value = '';
    mostrarApp(true);
  });
  $('btn-sair').addEventListener('click', async function () { await sb.auth.signOut(); mostrarApp(false); });
  $('de').addEventListener('change', carregar);
  $('ate').addEventListener('change', carregar);

  sb.auth.getSession().then(function (r) { if (r.data && r.data.session) mostrarApp(true); });
})();
</script>
</body>
</html>
